spring:
  application:
    name: authserver
  datasource:
    url: jdbc:h2:mem:treviqo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    br.pucpr.authserver.treviqo: INFO

springdoc:
  cache:
    disabled: true
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
